/*

*/
//↓配列宣言等（ここは無視して次の「パラメータ設定」へ）----------
trainPicture=new Array();for(i=1;i<=2;i++){trainPicture[i]=new Array()}trainLength=new Array();doorHandling=new Array();trainLocoHead=new Array();glassOK=new Array();glassFile=new Array();glassOpacity=new Array();glassPngOK=new Array();glassPngFile=new Array();


//▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
//↓パラメータ設定

//▼車輌画像の基本設定
//↓車輌画像の規格
trainHeightPixel=60;//車輌画像の天地寸法（単位ピクセル・初期値 60）
//↓車輛画像フォルダ
trainFolderName="traingif";//車両画像フォルダ名（初期値 "traingif"）
//ここを変えた場合は「traingifフォルダ云々」という説明は読み替えられよ。

//▼編成の設定
//↓編成長
trainLength[1]=2000;//列車の編成長（単位ピクセル・1190以下の時のみ列車通過後に踏切が開く）
//↓車輌画像ファイル名
trainPicture[1][1]="kitEC_base4_TCL.gif";//左端車輌（拡張子付）
trainPicture[1][2]="kitEC_base4_M2.gif";//２両目
trainPicture[1][3]="kitEC_base4_M1.gif";//３両目（20m車＋幅800pxモニタでは以下の車輌は見えない）
trainPicture[1][4]="kitEC_base4_M2.gif";//４両目
trainPicture[1][5]="kitEC_base4_M1.gif";//５両目（20m車＋幅1024～1152pxモニタでは以下の車輌は見えない）
trainPicture[1][6]="kitEC_base4_TCR.gif";//６両目（20m車＋幅1280pxモニタでは以下の車輌は見えない）
//trainPicture[1][1]="";//７両目（20m車の場合、以下は画面内には表示されない）
//trainPicture[1][8]="";//８両目
//trainPicture[1][9]="";//９両目
//trainPicture[1][10]="";//10両目
//使用しない車輌は削除、またはコメントアウト（行頭に//を入れる）しなければならない。
//"と"の間に画像ファイル名を書込む時、"を間違って削除しないよう注意！（エラーになる）
//↓ドア扱いの設定　v3.0-
doorHandling[1]=true;//自車が「ドア扱いあり」ならtrue、なしならfalse。
//↑ドア扱いありにすると、駅停車時にドア開。ドア開時には発車不可。
//自車の見た目のドア開閉は相対式プラットフォーム時のみ。
trainLocoHead[1]=false;//自車の先頭が機関車ならtrue、電車や気動車ならfalse。
//↑先頭車輌（＝自車の場合、左端車輌）が機関車か否かというのは、先頭車輌のドア開閉の有無を意味する。
doorOpenSecond=10;//ドアを開いている時間（単位・秒／10～）
doorOKoverPosition=1.5;//ドア開閉可能な駅停車位置超過範囲（単位・m／1～10）
doorOKlessPosition=10;//ドア開閉可能な駅停車位置不足範囲（単位・m／1～200）

//↓空気抵抗増加装置　v3.7-
airResistanceBrakeOK=false;//非常制動時に空気抵抗ブレーキを出すならtrue、そうでないなら false。
airResistanceSpeed=50;//空気抵抗ブレーキ作動の下限速度（単位・km/h／1～）
airResistanceCode="arb";//空気抵抗ブレーキ用コード（任意の文字列／ファイル名に付加する）
//車輛ファイル名が"kitEC_base4_TCL.gif"＋コード"arb"だとすると、空力ブレーキ作動時の車輛画像名が"kitEC_base4_TCLarb.gif"となる。
//空気抵抗ブレーキ搭載のJR東日本 E954が登場した事により、v3.7からこの機能を追加した。

//▼対向列車の設定　v2.0-
//↓時々駅に停車している対向車輌の有無。
anotherTrain=true;//trueで対向列車あり、falseでなし。
anotherTrainStopOffset=2;//対向列車の駅停車位置調整（単位ピクセル・正数で右へ／初期値2）
//対向列車の編成
trainPicture[2][1]="kitEC_103_chuo.gif";//左端車輌（拡張子付）
trainPicture[2][2]="kitEC_103_chuo.gif";//２両目（ドア閉画像（～aのつかないファイル名）を指定すること）
//trainPicture[2][3]="";//３両目
//trainPicture[2][4]="";//４両目
//trainPicture[2][5]="";//５両目
//trainPicture[2][6]="";//６両目
//trainPicture[2][7]="";//７両目
//trainPicture[2][8]="";//８両目
//trainPicture[2][9]="";//９両目
//trainPicture[2][10]="";//10両目
//使用しない車輌は削除、またはコメントアウト（行頭に//を入れる）しなければならない。
//↓ドア扱いの設定　v3.0-
doorHandling[2]=true;//対向列車が「ドア扱いあり」ならtrue、なしならfalse。
trainLocoHead[2]=false;//対向列車の先頭が機関車ならtrue、電車や気動車ならfalse。
//↑先頭車輌（＝対向列車の場合、右端車輌）が機関車か否かというのは、先頭車輌のドア開閉の有無を意味する。
//対向列車のドア開閉は島式プラットフォーム時のみ有効（ドア閉車輌を指定）
//ドア扱いなしにすると、対向列車の駅発車シーンも停止する。
//ドア扱いなし設定時の指定方法は v3.8から変更になっているので注意！

//▼列車の性能等の設定
maxpotential=160;//潜在限界速度（km/h）この数値が低いと高速時の加速が大きくにぶる。
speedlimit=135;//最高時速（km/h）
//↓コントローラの加減速設定（マイナスで減速、プラスで加速）
emergentBrake=-4.9;//非常制動（初期値 -4.5）
fullbrake=-3.8;//制動上限（初期値 -3.5）
fullpower=3.1;//力行上限（初期値 2.5）
powerOff=-0.09;//惰行時の自然減速（初期値 -0.09）
//↑上限値だけでなく各段を個別に設定したい場合は↓を設定。
b3ratio=0.75;//制動3 の制動上限に対する比率（初期値 0.75）
b2ratio=0.50;//制動2〃（初期値 0.5）
b1ratio=0.25;//制動1〃（初期値 0.25）
n1ratio=0.55;//力行1 の力行上限に対する比率（初期値 0.55）

//▼半透明窓の設定（CSS指定による半透明窓）
//↓自列車
glassOK[1]=true;//半透明窓設定するならtrue、しないならfalse。
glassFile[1]="glassECbase4_6.gif";//半透明窓用画像（自列車と重なる画像／１編成で１枚なので注意／拡張子付指定）
glassOpacity[1]=20;//窓の不透明度（単位％・0で完全透明、100で不透明／初期値 40）
//↓対向列車
glassOK[2]=false;//半透明窓設定するならtrue、しないならfalse。
glassFile[2]="～.gif";//半透明窓用画像（対向列車と重なる画像／１編成で１枚なので注意／拡張子付指定）
glassOpacity[2]=20;//窓の不透明度（単位％・0で完全透明、100で不透明／初期値 40）
//半透明窓用画像は traingifフォルダに入れる。

//▼半透明窓の設定（PNG-alpha channelによる半透明窓）v3.5-
//↓自列車
glassPngOK[1]=true;//半透明窓設定するならtrue、しないならfalse。
glassPngFile[1]="glassECbase4_6.png";//半透明画像（自列車と重なる画像／１編成で１枚なので注意／拡張子付指定）
//↓対向列車
glassPngOK[2]=false;//半透明窓設定するならtrue、しないならfalse。
glassPngFile[2]="～.png";//半透明画像（対向列車と重なる画像／１編成で１枚なので注意／拡張子付指定）

//▼半透明窓画像の使い分け　v4.0-
glassChoice=0;//下記から選択
//0=標準。WinIE9までを CSS filterによる半透明、その他ブラウザを 24bit-PNG。
//1=CSS優先。ほぼ全てのブラウザで PNGを使わず CSS指定による半透明。
//2=PNG優先。WinIE7以降はすべて 24bit-PNG。
//PNG優先でも PNG画像を指定していなければキャンセルとなるので注意。

//▼半透明窓の位置ずれ　v3.61-
glassOffset=0;//半透明窓の位置を指定数値分、左右へずらす（自列車のみ。単位ピクセル／負数で左へ、正数で右へ）
//ヘッドライト表現などに半透明窓を使う場合に列車より左にずらすことができる。

//▼駅の設定
//↓駅タイプの指定
islandPF=false;//島式ならtrue、相対式ならfalse。
//↓駅画像ファイル名（島式設定時）
stationBimgFile="station_M1001isb.gif";//島式プラットフォームの画像名（拡張子付）
stationFimgFile="station_M1001isf.gif";//列車の手前になる駅舎などの画像名（拡張子付）
//↓駅画像ファイル名（相対式設定時）
stationBimgFileOp="station_M1001opb.gif";//奥のプラットフォーム画像名（拡張子付）
stationFimgFileOp="station_M1001opf.gif";//手前のプラットフォームや駅舎などの画像名（拡張子付）
//↓駅画像左端と駅停止位置のズレ
stopPositionOffset=50;//停止位置を変更する場合に変更（単位ピクセル・初期値50／範囲0～700）
//正確には停止位置はそのままで駅の方の座標をずらしている。
//↓駅停止位置表示画像指定
stopPositionPict="stopposition_b.gif";//駅停止位置表示の画像（初期指定は黒文字・拡張子付）
//背景色によっては黒文字では見えないので、その場合"stopposition_w.gif"にすると白文字になる。

//▼架線の設定
//↓架線設定
electrified=true;//電化（架線あり）ならtrue、非電化ならfalse。
wireImgFile="trolley_wire.gif";//架線画像
pantographHeight=5.1;//パンタ高（単位 m）
//パンタ高にあわせた高さに架線をセットするが、初期値から変更する場合は、トンネルと架線柱を描き直す必要がある。
//↓架線柱画像ファイル名
poleImgFile="pole_type1.gif";//架線柱画像名（拡張子付・gif以外はエラーの可能性あり）
//背景が動くM系では架線を消すと速度感がなくなるが、背景に木を植える等、工夫することで回避可能ではあるようだ。
//↓駅周辺の手前架線柱設定
poleFOK=true;//列車の手前になる駅周辺のみの架線柱の有無（true=表示、false=非表示）
poleImgFileF="pole_type1.gif";//列車の手前になる駅周辺のみの架線の画像名（拡張子付・gif以外はエラーの可能性あり）
//相対式プラットフォーム指定時は自動的に駅手前架線柱はfalseになるので注意！
//相対式では手前架線柱は駅画像に描かねばならない。
poleAndWireImgWidth=320;//架線画像と架線柱画像の幅（ピクセル指定）v3.9
//↑IE6後期版で発生した「線路が表示されない」という問題の解決策に必要となったパラメータ。
oldwire=false;//ver2以前の架線＋架線柱画像を使う場合は trueにして架線柱画像を指定、ver3以後の架線と架線柱を分離した画像を使う時は false（旧バージョン互換用）

//▼線路の設定
//↓線路画像ファイル名
railImgFile="rail_normal.gif";//レールの画像指定（拡張子付・gif以外はエラーの可能性あり）
railImgWidth=32;//レール画像の幅（ピクセル指定）v3.9
//↑IE6後期版で発生した「線路が表示されない」という問題の解決策に必要となったパラメータ。
oldrail=false;//v2以前のレール画像を使うならtrue、v3以後のレールを使うならfalse 。

//▼踏切の設定
//↓踏切設定
crossingOK=true;//踏切表示（true=表示、false=非表示）
crossing1offset=10000;//踏切１位置（初期値10000）
crossing2offset=4600;//踏切２位置（初期値4600）
//↓閉じた踏切画像ファイル名
crossImgFileB1="cross_M1002_B1.gif";//線路の奥の閉じた踏切画像名（拡張子付）
crossImgFileF1="cross_M1002_F1.gif";//線路の手前の　〃
//↓開いた踏切画像ファイル名
crossImgFileB0="cross_M1002_B0.gif";//線路の奥の開いた踏切画像名（拡張子付）
crossImgFileF0="cross_M1002_F0.gif";//線路の手前の　〃
crossImgWidth=107;//踏切画像の幅（初期値107・動作時に必要）
//↑開いた画像は列車編成長が1190ピクセル以下の時のみ必要。なお動作はA01と異なり開閉２段階。

//▼信号の設定
//↓信号設定（制約が多いので初期値以外に変更する場合は注意が必要）
signalOK=true;//信号表示（true=表示、false=非表示）
signal1offset=2320;//信号１位置（初期値2320・駅）
signal2offset=7120;//信号２位置（初期値7120）- 信号２以降は 2400以上でないと正常に動作しない。
signal3offset=11600;//信号３位置（初期値11600・鉄橋直後）
signal4offset=14800;//信号４位置（初期値14800・トンネル手前）
//↓信号画像ファイル名（ファイル名のRやGより前の部分のみ記入・当然拡張子なし）
signalFileNameHead="signal1L_";//←この場合、"signal1L_R.gif"または"signal1L_G.gif"になる。
//↑ファイル名が"～R.gif"と"～G.gif"であることが必須。
//踏切位置と信号位置は架線柱と重ならないよう、要チェック。
//信号画像のサイズを変更しても画面には反映されないので注意。

//▼トンネルと橋の設定
//↓トンネル
tunnelOK=true;//トンネル表示（true=表示、false=非表示）
tunneloffset=13062;//トンネル位置（初期値13062）
tunnelImgFile="tunnel_M1001.gif";//トンネルの画像名（拡張子付）
//↓鉄橋
bridgeOK=true;//鉄橋表示（true=表示、false=非表示）
bridgeoffset=11854;//鉄橋位置（初期値14734トンネル手前,11854トンネル後）
bridgeImgFile="bridge_M1001girder.gif";//鉄橋の画像名（拡張子付）
//トンネルと鉄橋位置は初期値から、320ピクセル（架線画像左右長=架線柱間隔）単位でずらさないと架線表示に問題あり。制約が多いので初期値以外に変更する場合は注意が必要。
//v3.0以降、トンネルに関してはポータル部分が架線柱と重ならない限り、そんなに厳密な位置である必要がなくなった。

//▼その他の近景（線路脇）配置物の設定
tracksideObj1OK=false;//近景配置物予備1（何かを配置するならtrue）
tracksideObj1offset=0;//予備1座標
tracksideObj1img="～.gif";//予備1に配置する画像名（拡張子付）
//
tracksideObj2OK=false;//近景配置物予備2
tracksideObj2offset=0;//予備2座標
tracksideObj2img="～.gif";//予備2に配置する画像名

/*【注意！！配置物に関する制約】
0-1700に配置したものは走行中に突然消える可能性あり。
16000-17700に配置したものは走行中に突然出現する可能性あり。
↑上記問題は未対策だが裏技はある。
近景配置物予備1と予備2に同じ画像を指定して、２つの配置物をちょうど16000だけずれた座標に配置するのだ。
ちなみに、テストモードで上記範囲を表示する。*/


//▼背景の設定
//↓超遠景の画像
vistaImgFile="scene_M1001d.jpg";//（拡張子付・gif以外でもOK）
//↓遠景の画像
farBackgroundImgFile="scene_M1001c.gif";//（拡張子付・gif以外はエラーの可能性あり）
farBackgroundImgWidth=1600;//遠景画像幅（ピクセル）v3.91
//↓中景の画像
midBackgroundImgFile="scene_M1001b.gif";//（拡張子付・gif以外はエラーの可能性あり）
midBackgroundImgWidth=1600;//中景画像幅（ピクセル）v3.91
//↓中近景
nearBackgroundOK=false;//中近景に画像を配置するならtrue;
nearBackgroundImgFile="～.gif";//（拡張子付・gif以外はエラーの可能性あり）
nearBackgroundImgWidth=1600;//中近景画像幅（ピクセル）v3.91

//▼長距離モードの設定
//↓駅間距離
doubleDistance=true;//一巡の走行距離 3.2km相当ならtrue、1.6km相当ならfalse（初期値 false）
bridgeImgFile2="bridge_M1002truss.gif";//3.2km走行時には一巡毎に橋の絵を切り替える。もうひとつの橋画像を指定。
//切替えたくない場合は、通常の橋と同じファイル名を指定。

//▼キー操作の設定
keycontrolOK=true;//trueでキー操作選択可。falseで不可。
keyOnStart=true;//初期状態でキー操作Onならtrue、Offならfalse（keycontrolOKが falseの時は無効）
keyNotchType=0;//キー操作時のノッチ扱い方法。0でノッチ戻しなし（戻すと一気に「切」まで移動）、1でノッチ戻しあり。
//↑M01の場合は、力行ノッチが２つしかないので、どっちに設定しても余り違わないかも。
keyguidePictureM01="keyboardM01_w.gif";//キー操作ガイド画像名（拡張子付・248×73px必須）
//↑背景色と合わない等の理由により画像変更する場合はここを変更。_wは白文字、_bは黒文字。

//▼その他の設定
//↓海外鉄道対応（初期値false =日本国内）
keepRight=false;//右側通行ならtrue、左側通行ならfalse。列車と信号機の奥と手前の関係を逆転させる。
byTheYard=false;//速度表示や駅停車位置表示の単位切替（true=MPH・yard／false=km/h・m）
//↓記録保存
saveOK=true;//trueでcookieによる記録保存あり。falseで保存なし。
saveDays=365;//記録保存日数（日／30～1000）
cookieNameM01="M01bestrecord";//cookieの名前。
//同じ名前のcookieが重なると記録が共用されるので、手動運転版を複数置く時は名前を変える。
//ver.3.0以前の記録を残す場合は"yourbest"という名前にする。
//なお"yourbest"と"yourbest2"のような、片方がもう一方の文字列を完全に含むような関係になっていると、含まれた文字列のある側のプログラムでエラーになるので注意！
//M01・M02 ver.3.0以前とフォルダを共用すると、M01・M02の記録表示がおかしくなるので注意。v3.1以降なら問題なし。
//↓情報表示

//Run----------------------------------------------------
timespersecond=10;
direction=0;//0=foward(left),1=back(right)
kinkeipos=-2000;enkeipos=0;
potentialratio=1;//v1.2
accelresistance=0;//v1.2
accel=0;
realspeed=0;
speed=0;
totalrun=0;
ekimade=16000;zureflag=0;
safetytimer=0;safetylimit=200;
anotherTrainflag=false;//v2.0
anotherTrainCount=-1;
anotherAccel=0;
anotherRealSpeed=0;
anotherSpeed=0;
anotherRun=0;
pseudoTrolleyPos=-2000;
pseudoRailPos=-2000;
function trainControl(){
	accelresistance=(realspeed/maxpotential)*(realspeed/maxpotential)//v1.2
	potentialratio=(1-accelresistance);//v1.2
	if(potentialratio<0){potentialratio=0};//v1.2
	if(potentialratio>1){potentialratio=1};//v1.2
	if(accel>0){accel=accelnow*potentialratio}else{accel=accelnow};//v1.2
	realspeed+=(accel/timespersecond)*delayratio;
	if(realspeed<0){realspeed=0};if(realspeed>speedlimit){realspeed=speedlimit};
	speed=(realspeed/0.36/timespersecond)*delayratio;
	if(direction==0){
		kinkeipos+=speed;
		pseudoTrolleyPos+=speed;if(pseudoTrolleyPos>-2000){pseudoTrolleyPos-=checkPixelForTrolley;}
		pseudoRailPos+=speed;if(pseudoRailPos>-2000){pseudoRailPos-=checkPixelForRail;}
	}else{
		kinkeipos-=speed;
		pseudoTrolleyPos-=speed;if(pseudoTrolleyPos<-2000-checkPixelForTrolley){pseudoTrolleyPos+=checkPixelForTrolley;}
		pseudoRailPos-=speed;if(pseudoRailPos<-2000-checkPixelForRail){pseudoRailPos+=checkPixelForRail;}
	};
	runLR();
	ekipos=Math.round(kinkeipos+2000+ekipresetPos);
	tunnelpos=Math.round(kinkeipos+tunneloffset);
	bridgepos=Math.round(kinkeipos+bridgeoffset);
	crossing1pos=Math.round(kinkeipos+crossing1offset);
	crossing2pos=Math.round(kinkeipos+crossing2offset);
	signal1pos=Math.round(kinkeipos+signal1offset);
	signal2pos=Math.round(kinkeipos+signal2offset);
	signal3pos=Math.round(kinkeipos+signal3offset);
	signal4pos=Math.round(kinkeipos+signal4offset);
	tracksideObj1pos=Math.round(kinkeipos+tracksideObj1offset);
	tracksideObj2pos=Math.round(kinkeipos+tracksideObj2offset);
	hashiraSpos=Math.round(kinkeipos+2240);
	stoplinepos=ekipos+stopPositionOffset;
	chukinkeipos=Math.round(kinkeipos/2);
	chukeipos=Math.round(kinkeipos/5);
	enkeipos=Math.round(kinkeipos/10);
	kinkeiposInt=Math.round(kinkeipos);
	if(anotherTrain){
		anotherRealSpeed+=(anotherAccel/timespersecond);
		anotherSpeed=Math.round((anotherRealSpeed/0.36/timespersecond)*delayratio);
		anotherRun+=anotherSpeed;
		if(anotherRun>2000){
			anotherRun=2000;layerHide('densha2');
			if(glassOK[2]||glassPngOK[2]){layerHide('windowglass2');}//
		};
		layerMoveX('densha2',ekipos+stopPositionOffset+anotherTrainStopOffset+anotherRun);
		if(glassOK[2]||glassPngOK[2]){layerMoveX('windowglass2',ekipos+stopPositionOffset+anotherTrainStopOffset+anotherRun);}
	}
	pseudoTrolleyPosInt=Math.round(pseudoTrolleyPos);
	pseudoRailPosInt=Math.round(pseudoRailPos);
	layerMoveX('hashira',pseudoTrolleyPosInt);
	layerMoveX('kasen',pseudoTrolleyPosInt);
	layerMoveX('senro',pseudoRailPosInt);
	layerMoveX('eki',ekipos);layerMoveX('ekiOp',ekipos);
	layerMoveX('ekisha',ekipos);
	if(tunnelOK){layerMoveX('tunnel',tunnelpos);}
	if(bridgeOK){layerMoveX('bridge',bridgepos);}
	if(crossingOK){
		layerMoveX('crossingF1',crossing1pos);
		layerMoveX('crossingB1',crossing1pos);
		layerMoveX('crossingF2',crossing2pos);
		layerMoveX('crossingB2',crossing2pos);
		if(crossMoveFlag){crossCheck();}
	}
	if(tracksideObj1OK){layerMoveX('tracksideObj1',tracksideObj1pos)};
	if(tracksideObj2OK){layerMoveX('tracksideObj2',tracksideObj2pos)};
	layerMoveX('hashiraS',hashiraSpos);
	layerMoveX('tomare',stoplinepos);
	layerMoveX('chukinkei',chukinkeipos);
	layerMoveX('chukei',chukeipos);
	layerMoveX('enkei',enkeipos);
	if(signalOK){
		layerMoveX('signal1',signal1pos);
		layerMoveX('signal2',signal2pos);
		layerMoveX('signal3',signal3pos);
		layerMoveX('signal4',signal4pos);
		if(signal1pos>400){signalChange('1','R')};
		if(signal2pos>400){signalChange('2','R')};
		if(signal3pos>400){signalChange('3','R')};
		if(signal4pos>400){signalChange('4','R')};
	}
	if(!doorCountOK){
		if(speed==0){
			safetytimer++;
			if(safetytimer>safetylimit){
				stopTrain();
			}
		}else{
			safetytimer=0;
		}
	}
	if(speed>2)zureflag=1;
	infodisplay();
	//yscrollCheck();scrollTo(0,yyy);
	if(antidelay){
		if(delaychecktimer==1){
			delaychecker(0)
		}
		if(delaychecktimer>=(timespersecond/2)+1){
			delaychecker(1)
			delaychecktimer=0;
		}
		delaychecktimer++;
	}else{
		delayratio=1;
	}
	if(testmode){
		testcheck2();
		if(ie){
			layerMoveX('areaX1',Math.round(kinkeipos));
			layerMoveX('areaX2',Math.round(kinkeipos)+16000);
		}
	}
	if(airResistanceBrakeOK){aeroBrakeControl()}
	doorCountDown();
}

			}else{
				anotherTrainflag=false;
				layerHide('eki');layerHide('ekisha');layerHide('ekiOp');
				layerHide('tunnel');
				layerHide('tomare');recordflag=0;
				if(bridgeOK){imgChange('bridgeImg',sceneFolderName+bridgeImgFile2,'bridge');}
			}
		}else{
			anotherTrainCount++;
			if(anotherTrainCount>1){anotherTrainCount=0}
			if(anotherTrainCount==0){anotherTrainflag=true}else{anotherTrainflag=false};
			layerShow('tomare');
			recordflag=1;
		}
		if(kinkeipos>-100){
			kinkeipos-=16000;
			if(signalOK){
				signalChange('1','G');signalChange('2','G');signalChange('3','G');signalChange('4','G');
			}
			if(anotherTrain){
				if(anotherTrainflag){
					if(islandPFdoor){
						for(i=1;i<=trainPicture[2].length-1;i++){
							train2doorNum="ec"+i;
							train2doorOpened=trainFolderName+trainPictureHead[2][i]+doorOpenCode2+trainPictureSfx[2][i];
							if(trainLocoHead[2]&&i==trainPicture[2].length-1){
								void(0);
							}else{
								imgChange(train2doorNum,train2doorOpened,'densha2');
							}
						}
					}
					layerShow('densha2');
					if(glassOK[2]||glassPngOK[2]){layerShow('windowglass2')}
				}else{
					layerHide('densha2');
					if(glassOK[2]||glassPngOK[2]){layerHide('windowglass2')}
				}
			}
		};
		if(kinkeipos<-16100){kinkeipos+=16000}
	}
}

function kup(e){
	displaychange(0);
}
function kprs(e){
	if(ie){keyNum=event.keyCode};
	if(nn4||nn6){keyNum=e.which};
	if(keyNum==32){//---On/Off
		if(runrunflag==true){
			stopTrain();
		}else{
			startTrain();
		}
	}
	if(keyNum==45){//(-)---Brake
		notch--;if(notch<0){notch=0};
		if(notch==6&&keyNotchType==0){notch=5};
		gogoTrain(notch);
	}
	if((keyNum==82||keyNum==114)&&notch!=0){//(Rr)---Brake
		notch--;if(notch<1){notch=1};
		if(notch==6&&keyNotchType==0){notch=5};
		gogoTrain(notch);
	}
	if(keyNum==70||keyNum==102||keyNum==43){//(Ff+)---Power
		if(notch<5||doorCloseNow){
			notch++;if(notch>7){notch=7};
			gogoTrain(notch);
		}else{
			displaychange(12);
		}
	}
	if(keyNum==69||keyNum==101){//(Ee)---Emergency
		notch=0;
		gogoTrain(notch);
	}
	if(keyNum==42){//(*)---前後
		dirchange();
	}
	if(keyNum==84||keyNum==116){//(Tt)---前後
		dirchange();
	}
	return false;
}
