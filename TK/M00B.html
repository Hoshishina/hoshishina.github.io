//Run--------------------------------------
trainNow=1;nextTrain=2;if(howmanytrains==1){nextTrain=1};
sceneposbase=0;scenepos=sceneposbase;
trainRightPos=0;
function trainControl(){
	blurPx=Math.round(Math.abs(realspeed*speedratio)/3.6*blurRatio);
	if(sceneScroller){
		scrollstartpointR=windowwidthpx-scrollChangeCoordinateR;
		scrollstartpointL=scrollChangeCoordinateL;
		if((trainposbase>scrollstartpointR&&sceneposbase>sceneScrollingPx&&directionNow==1)||(trainposbase<scrollstartpointL&&sceneposbase<0&&directionNow==0)){
			sceneposbase-=(realspeed*speedratio);
			if(sceneposbase<sceneScrollingPx){
				trainposbase+=(sceneScrollingPx-sceneposbase);
				sceneposbase=sceneScrollingPx;
			}
			if(sceneposbase>0){
				trainposbase-=sceneposbase;
				sceneposbase=0;
			}
			if(blurEffect){blurOff()};
		}else{
			trainposbase+=(realspeed*speedratio);
			if(blurEffect){blurOn()};
		}
	}else{
		trainposbase+=(realspeed*speedratio);
		if(blurEffect){blurOn()};
	}
	if(trainposbase<leftlimit[trainNow]||trainposbase>rightlimit){trainChanger()}
	trainpos=Math.round(trainposbase);
	scenepos=Math.round(sceneposbase);
	checkpos=trainpos-scenepos;
	vistapos=Math.round(sceneposbase*vistaScrollRatio);
	bbgpos=Math.round(sceneposbase*overBackScrollRatio);
	trainRightPos=checkpos+trainLength[trainNow];
	crossControl();
	signalControl();
	layerMoveX('densha',trainpos);
	if(glassOK[trainNow]){layerMoveX('mado',trainpos+glassOffset[trainNow]);}
	if(sceneScroller){
		layerMoveX('enkei',vistapos);
		layerMoveX('haikeioku',bbgpos);
		layerMoveX('haikei',scenepos);
		layerMoveX('zenkei',scenepos);
		layerMoveX('kasen',scenepos);
		layerMoveX('hashira',scenepos);
		layerMoveX('senro',scenepos);
		layerMoveX('fumikiriB',scenepos+crossingPos);
		layerMoveX('fumikiriF',scenepos+crossingPos);
		layerMoveX('shingoR',scenepos+signalRpos);
		layerMoveX('shingoL',scenepos+signalLpos);
	}
	if((scrollspoil&&zeroscroll==false)||(scrollspoil&&speedratio!=0&&zeroscroll)){yscrollCheck();scrollTo(0,yyy)};
	trainTimerStarted=true;
	traintimer=setTimeout('trainControl()',100);
}

}

//Controler-------------------------------------
touchXpos=0;touchYpos=0;
isTouchable=false;
if(window.TouchEvent){
	if(window.addEventListener){
		isTouchable=true;
	}
}
isTouchedNow=false;
function touchBtn(e){
	e.preventDefault();
	fingerTouchObj=e.changedTouches[0];
	touchXpos=fingerTouchObj.pageX;
	touchYpos=fingerTouchObj.pageY;
	fingerTouchType=e.type;
	if(fingerTouchType=="touchstart"){
		isTouchedNow=true;
		btnTouch(e);
	}else if(fingerTouchType=="touchmove"){
		btnTouch(e);
	}else if(fingerTouchType=="touchend"){
		isTouchedNow=false;
	}else if(fingerTouchType=="touchcancel"){
		isTouchedNow=false;
	}
	return false;
}
var protectlayer;var btnlayer;var msobjobj;
function mousepreset(){
	if(nn4){
		btnlayer=document.layers['tetsudou'].document.layers['controlerbar'];
		protectlayer=document.layers['tetsudou'].document.layers['protector'];
		btnlayer.captureEvents(Event.MOUSEDOWN|Event.MOUSEMOVE);
		protectlayer.captureEvents(Event.MOUSEDOWN);
		document.captureEvents(Event.MOUSEUP)
	}
	if(ie){
		btnlayer=document.all("controlerbar");
		protectlayer=document.all("protector");
		protectlayer.onmousemove=ptMove;
	}
	if(nn6){
		btnlayer=document.getElementById("controlerbar");
		protectlayer=document.getElementById("protector");
	}
	if(!automaticRun){
		btnlayer.onmousedown=btnDwn;
		btnlayer.onmousemove=btnMove;
		if(isTouchable){
			btnlayer.addEventListener("touchstart",touchBtn,false);
			btnlayer.addEventListener("touchmove",touchBtn,false);
			btnlayer.addEventListener("touchend",touchBtn,false);
			btnlayer.addEventListener("touchcancel",touchBtn,false);
		}
	}
	protectlayer.onmousedown=ptDwn;
	document.onmouseup=btnUp;
}
function ptDwn(){self.focus();return false;}
function ptMove(){return false;}
var nowX;
function btnDwn(e){//mousedown
	msobjobj=this;
	if(nn4){nowX=e.pageX-3-sceneLeftMargin;}
	if(ie){nowX=event.clientX-3+document.body.scrollLeft-sceneLeftMargin;}
	if(nn6){nowX=e.pageX-3-sceneLeftMargin;}
	speedControler();
	return false;
}
function btnTouch(e){
	if(isTouchedNow){
		nowX=touchXpos-3-sceneLeftMargin;
		speedControler();
	}
	return false;
}
speedcontrolflag=-40;
function btnMove(e){//mousedrag
	if(!msobjobj){return true;}
	if(nn4){nowX=e.pageX-3-sceneLeftMargin;}
	if(ie){nowX=event.clientX-3+document.body.scrollLeft-sceneLeftMargin;}
	if(nn6){nowX=e.pageX-3-sceneLeftMargin;}
	speedControler();
	return false;
}
function speedControler(){
	if(nowX>136){nowX=136}
	if(nowX<26){nowX=26}
	layerMoveX('controlerbutton',nowX);
	speedcontrolflag=nowX-81;
	if(speedcontrolflag<-5){
		speedratio=(speedcontrolflag+5)/50;
		directionNow=0;
		realspeed=(trainspeedL[trainNow]/3.6/scaleRatio);
		layerShow('controlerL');
		layerHide('controlerR');
	}
	if(speedcontrolflag>5){
		speedratio=(speedcontrolflag-5)/50;
		directionNow=1;
		realspeed=(trainspeedR[trainNow]/3.6/scaleRatio);
		layerHide('controlerL');
		layerShow('controlerR');
	}
	if(speedcontrolflag>=-5&&speedcontrolflag<=5){
		speedratio=0;
		realspeed=0;
		layerHide('controlerL');
		layerHide('controlerR');
	}
}
function btnUp(e) {//mouseup
	msobjobj=null;
	if(!(speedcontrolflag<-5||speedcontrolflag>5)){layerMoveX('controlerbutton',81);}
}
//KeyControl----------------------------------
function setKeyControl(){if(automaticRun==false&&keyControlOK){
	if(ie||nn6){document.onkeypress=kprs;}
	if(nn4){window.onkeypress=kprs;window.captureEvents(Event.KEYPRESS);}
}}
function kprs(e){
	if(ie){keyNum=event.keyCode};
	if(nn4||nn6){keyNum=e.which};
	if(keyNum==70||keyNum==102){//(Ff)
		if(speedratio>0.8&&speedratio<=1){
			speedratio=0.8;layerMoveX('controlerbutton',86+40);
		}else if(speedratio>0.6&&speedratio<=0.8){
			speedratio=0.6;layerMoveX('controlerbutton',86+30);
		}else if(speedratio>0.4&&speedratio<=0.6){
			speedratio=0.4;layerMoveX('controlerbutton',86+20);
		}else if(speedratio>0.2&&speedratio<=0.4){
			speedratio=0.2;layerMoveX('controlerbutton',86+10);
		}else if(speedratio>0&&speedratio<=0.2){
			speedratio=0;directionNow=0;layerMoveX('controlerbutton',81);
			layerHide('controlerL');layerHide('controlerR');
			realspeed=0;
		}else if(speedratio<=0&&speedratio>-0.2){
			speedratio=-0.2;directionNow=0;layerMoveX('controlerbutton',76-10);
			layerShow('controlerL');layerHide('controlerR');
			realspeed=(trainspeedL[trainNow]/3.6/scaleRatio);
		}else if(speedratio<=-0.2&&speedratio>-0.4){
			speedratio=-0.4;layerMoveX('controlerbutton',76-20);
		}else if(speedratio<=-0.4&&speedratio>-0.6){
			speedratio=-0.6;layerMoveX('controlerbutton',76-30);
		}else if(speedratio<=-0.6&&speedratio>-0.8){
			speedratio=-0.8;layerMoveX('controlerbutton',76-40);
		}else if(speedratio<=-0.8&&speedratio>-1){
			speedratio=-1;layerMoveX('controlerbutton',76-50);
		}
	}
	if(keyNum==71||keyNum==103||keyNum==72||keyNum==104){//(GgHh)
		speedratio=0;layerMoveX('controlerbutton',81);
		layerHide('controlerL');layerHide('controlerR');
		realspeed=0;
	}
	if(keyNum==74||keyNum==106){//(Jj)
		if(speedratio>=-1&&speedratio<-0.8){
			speedratio=-0.8;layerMoveX('controlerbutton',76-40);
		}else if(speedratio>=-0.8&&speedratio<-0.6){
			speedratio=-0.6;layerMoveX('controlerbutton',76-30);
		}else if(speedratio>=-0.6&&speedratio<-0.4){
			speedratio=-0.4;layerMoveX('controlerbutton',76-20);
		}else if(speedratio>=-0.4&&speedratio<-0.2){
			speedratio=-0.2;layerMoveX('controlerbutton',76-10);
		}else if(speedratio>=-0.2&&speedratio<0){
			speedratio=0;directionNow=1;layerMoveX('controlerbutton',81);
			layerHide('controlerL');layerHide('controlerR');
			realspeed=0;
		}else if(speedratio>=0&&speedratio<0.2){
			speedratio=0.2;directionNow=1;layerMoveX('controlerbutton',86+10);
			layerHide('controlerL');layerShow('controlerR');
			realspeed=(trainspeedR[trainNow]/3.6/scaleRatio);
		}else if(speedratio>=0.2&&speedratio<0.4){
			speedratio=0.4;layerMoveX('controlerbutton',86+20);
		}else if(speedratio>=0.4&&speedratio<0.6){
			speedratio=0.6;layerMoveX('controlerbutton',86+30);
		}else if(speedratio>=0.6&&speedratio<0.8){
			speedratio=0.8;layerMoveX('controlerbutton',86+40);
		}else if(speedratio>=0.8&&speedratio<1){
			speedratio=1;layerMoveX('controlerbutton',86+50);
		}
	}
	return false;
}
